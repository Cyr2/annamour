name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Lint and format
        run: pnpm lint
      - name: Typecheck
        run: pnpm typecheck
      - name: Install ffmpeg (lighter qualities are encoded for real in a test)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - name: Tests with coverage thresholds
        run: pnpm test
      - name: Build
        run: pnpm build

  e2e:
    name: e2e
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install Google Chrome (H.264 support)
        run: pnpm --filter @annamour/e2e exec playwright install --with-deps chrome
      - name: Two browsers watch the same film
        run: pnpm e2e
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-traces
          path: e2e/test-results

  # A measurement, not a gate: never required, never blocks a merge.
  reseau-faible:
    name: reseau-faible
    runs-on: ubuntu-latest
    timeout-minutes: 30
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install ffmpeg (the film and its lighter qualities are made for real)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - name: Install Google Chrome (H.264 support)
        run: pnpm --filter @annamour/e2e exec playwright install --with-deps chrome
      - name: A weak 4G viewer and a fiber one watch together
        run: pnpm e2e:reseau-faible 2>&1 | tee weak-network.log
      - name: Measurement table
        if: always()
        run: |
          {
            echo '```'
            sed -n '/=== Weak-network measurement ===/,/^$/p' weak-network.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: weak-network-traces
          path: e2e/test-results

  docker:
    name: docker
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Build the production image
        run: docker build -t annamour:ci .
      - name: Build the naka-bridge image
        run: docker build -f apps/naka-bridge/Dockerfile -t naka-bridge:ci .
      - name: Smoke test the container
        run: |
          docker run -d --name annamour -p 8787:8787 -e KEY_PEPPER=ci-only-pepper -e NODE_ENV=production annamour:ci
          # Lighter qualities need ffmpeg inside the image.
          docker exec annamour ffmpeg -version | head -1
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8787/api/health; then exit 0; fi
            sleep 1
          done
          docker logs annamour
          exit 1
