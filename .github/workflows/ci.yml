name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Lint and format
        run: pnpm lint
      - name: Typecheck
        run: pnpm typecheck
      - name: Tests with coverage thresholds
        run: pnpm test
      - name: Build
        run: pnpm build

  docker:
    name: docker
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Build the production image
        run: docker build -t annamour:ci .
      - name: Smoke test the container
        run: |
          docker run -d --name annamour -p 8787:8787 annamour:ci
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8787/api/health; then exit 0; fi
            sleep 1
          done
          docker logs annamour
          exit 1
